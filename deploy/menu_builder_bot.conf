; Serverga: cp deploy/menu_builder_bot.conf /etc/supervisor/conf.d/
; Papka yoki nom boshqacha bo'lsa — directory, command va log yo'llarini o'zgartiring.

[program:menu_builder_bot]
directory=/root/menu_builder
command=/root/menu_builder/venv/bin/python main.py
user=root

autostart=true
autorestart=true
startsecs=10
startretries=5

; asyncio toza yopilishi uchun SIGINT
stopsignal=INT
stopwaitsecs=15
stopasgroup=true
killasgroup=true

environment=PYTHONUNBUFFERED="1"

stdout_logfile=/var/log/menu_builder_bot.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/menu_builder_bot.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
